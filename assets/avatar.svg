<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Top Half Gradient (Fiery Orange/Amber) -->
    <linearGradient id="topOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA100"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Bottom Half Gradient (Deep Red/Orange) -->
    <linearGradient id="bottomRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#D91E18"/>
    </linearGradient>

    <!-- Blade Cut Laser Line Gradient -->
    <linearGradient id="bladeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF5500" flood-opacity="0.35"/>
    </filter>

    <!-- Slicing Clip Paths: Cutting diagonally from (60, 310) to (452, 170) -->
    <clipPath id="clipTop">
      <polygon points="0,0 512,0 512,170 0,310"/>
    </clipPath>

    <clipPath id="clipBottom">
      <polygon points="0,310 512,170 512,512 0,512"/>
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Glowing Circular Aura -->
  <circle cx="256" cy="230" r="150" fill="#FF5500" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- ================= SLICED ICON EMBLEM (%) ================= -->
  
  <!-- TOP HALF (Shifted up and left by 8px) -->
  <g clip-path="url(#clipTop)" transform="translate(-7, -9)" filter="url(#shadowFilter)">
    <!-- Percent symbol top parts -->
    <circle cx="175" cy="165" r="46" fill="url(#topOrange)"/>
    <circle cx="175" cy="165" r="23" fill="#0B0F19"/>
    <!-- Diagonal stroke top segment -->
    <line x1="365" y1="120" x2="147" y2="340" stroke="url(#topOrange)" stroke-width="48" stroke-linecap="round"/>
  </g>

  <!-- BOTTOM HALF (Shifted down and right by 8px to show the physical SLICE) -->
  <g clip-path="url(#clipBottom)" transform="translate(9, 11)">
    <!-- Diagonal stroke bottom segment -->
    <line x1="365" y1="120" x2="147" y2="340" stroke="url(#bottomRed)" stroke-width="48" stroke-linecap="round"/>
    <!-- Percent symbol bottom circle -->
    <circle cx="337" cy="295" r="46" fill="url(#bottomRed)"/>
    <circle cx="337" cy="295" r="23" fill="#0B0F19"/>
  </g>

  <!-- ================= SHARP LASER SLICE BLADE ================= -->
  <!-- The cutting slash line passing right through the division -->
  <g filter="url(#neonGlow)">
    <line x1="40" y1="318" x2="472" y2="162" stroke="url(#bladeGlow)" stroke-width="7" stroke-linecap="round"/>
    <line x1="90" y1="300" x2="422" y2="180" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Slice Sparks / Impact Particles -->
  <circle cx="256" cy="240" r="4" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="290" cy="225" r="2.5" fill="#FFD600"/>
  <circle cx="220" cy="252" r="2" fill="#FFA100"/>
  <circle cx="380" cy="195" r="3" fill="#FFFFFF"/>
  <circle cx="130" cy="285" r="3" fill="#FF5500"/>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- Brand Name -->
  <text x="256" y="415" 
        font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#FFFFFF" 
        text-anchor="middle">
    MENOS DA METADE
  </text>

  <!-- Handle Pill -->
  <rect x="131" y="438" width="250" height="30" rx="15" fill="#1E293B" stroke="#FF5500" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="256" y="458" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="1" 
        fill="#FF9E0B" 
        text-anchor="middle">
    @menosdametade.oficial
  </text>
</svg>
